name: project-3-streaming-bot-detection-m1

services:
  jobmanager:
    image: apache/flink:1.19.1-scala_2.12-java17
    platform: linux/amd64
    container_name: p3-flink-jobmanager
    command: jobmanager
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        jobmanager.memory.process.size: 1600m
        rest.address: jobmanager
        rest.bind-address: 0.0.0.0
        taskmanager.numberOfTaskSlots: 12
        parallelism.default: 3
    volumes:
      - ../../streaming:/opt/flink/jobs:ro
      - ../../infra/flink/lib:/opt/flink/usrlib:ro
      - ../../datasets:/opt/flink/datasets

  taskmanager:
    image: apache/flink:1.19.1-scala_2.12-java17
    platform: linux/amd64
    container_name: p3-flink-taskmanager
    command: taskmanager
    restart: unless-stopped
    depends_on:
      - jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.memory.process.size: 4096m
        taskmanager.numberOfTaskSlots: 12
        parallelism.default: 3
    volumes:
      - ../../infra/flink/lib:/opt/flink/usrlib:ro
      - ../../datasets:/opt/flink/datasets

  validation-job:
    image: apache/flink:1.19.1-scala_2.12-java17
    platform: linux/amd64
    container_name: p3-flink-validation-job
    depends_on:
      - jobmanager
      - taskmanager
      - redpanda
    command:
      - bash
      - -lc
      - |
        /opt/flink/bin/sql-client.sh \
          -l /opt/flink/usrlib \
          -D execution.target=remote \
          -D rest.address=jobmanager \
          -f /opt/flink/jobs/flink_job_validation.sql
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        rest.address: jobmanager
    volumes:
      - ../../streaming:/opt/flink/jobs:ro
      - ../../infra/flink/lib:/opt/flink/usrlib:ro
      - ../../datasets:/opt/flink/datasets
    restart: "no"

  analytics-job:
    image: apache/flink:1.19.1-scala_2.12-java17
    platform: linux/amd64
    container_name: p3-flink-analytics-job
    depends_on:
      - jobmanager
      - taskmanager
      - redpanda
    command:
      - bash
      - -lc
      - |
        /opt/flink/bin/sql-client.sh \
          -l /opt/flink/usrlib \
          -D execution.target=remote \
          -D rest.address=jobmanager \
          -f /opt/flink/jobs/flink_job_analytics.sql
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        rest.address: jobmanager
    volumes:
      - ../../streaming:/opt/flink/jobs:ro
      - ../../infra/flink/lib:/opt/flink/usrlib:ro
      - ../../datasets:/opt/flink/datasets
    restart: "no"

  operational-job:
    image: apache/flink:1.19.1-scala_2.12-java17
    platform: linux/amd64
    container_name: p3-flink-operational-job
    depends_on:
      - jobmanager
      - taskmanager
      - redpanda
      - postgres
    command:
      - bash
      - -lc
      - |
        JAR=/opt/flink/generated/operational-bot-scoring.jar
        if [[ ! -f "$${JAR}" ]]; then
          echo "Missing $${JAR}. Run ./infra/scripts/infra_setup_m4.sh first." >&2
          exit 1
        fi
        /opt/flink/bin/flink run -d \
          -c com.portfolio.botdetection.OperationalBotScoringJob \
          -D rest.address=jobmanager \
          -C file:///opt/flink/usrlib/flink-sql-connector-kafka-3.2.0-1.19.jar \
          -C file:///opt/flink/usrlib/flink-connector-jdbc-3.2.0-1.19.jar \
          -C file:///opt/flink/usrlib/postgresql-42.7.3.jar \
          "$${JAR}" \
          --bot-config /opt/flink/datasets/reference/bot_config.json \
          --normalization-values /opt/flink/generated/normalization_values.csv \
          --parallelism 3
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        rest.address: jobmanager
    volumes:
      - ../../infra/flink/generated:/opt/flink/generated:ro
      - ../../infra/flink/lib:/opt/flink/usrlib:ro
      - ../../datasets:/opt/flink/datasets
    restart: "no"
