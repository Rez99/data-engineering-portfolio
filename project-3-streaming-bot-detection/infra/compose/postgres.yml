name: project-3-streaming-bot-detection-m1

services:
  postgres:
    image: postgres:16-alpine
    container_name: p3-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: clickstream
      POSTGRES_USER: clickstream
      POSTGRES_PASSWORD: clickstream
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clickstream -d clickstream"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
