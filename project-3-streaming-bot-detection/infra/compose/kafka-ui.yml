name: project-3-streaming-bot-detection-m1

services:
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.8.4
    container_name: p3-redpanda-console
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: redpanda:9092
