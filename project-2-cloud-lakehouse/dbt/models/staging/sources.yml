version: 2

sources:
  - name: ecommerce_clickstream
    description: >
      Public ecommerce clickstream events loaded into an Iceberg table by the
      M2 Spark load workflow.
    schema: bronze

    tables:
      - name: events
        description: Event-level product views, cart actions, and purchases.
        columns:
          - name: event_time
            description: Timestamp when the event occurred in UTC.
          - name: event_type
            description: Event type such as view, cart, or purchase.
          - name: product_id
            description: Product identifier.
          - name: category_id
            description: Product category identifier.
          - name: category_code
            description: Human-readable product category when available.
          - name: brand
            description: Product brand when available.
          - name: price
            description: Product price at the time of the event.
          - name: user_id
            description: User identifier.
          - name: user_session
            description: Session identifier.
