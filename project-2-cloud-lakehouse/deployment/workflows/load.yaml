main:
  steps:
    - initialize:
        assign:
          - project: ${project_id}
          - region: ${region}
          - cluster: ${cluster_name}
          - dataproc_url: https://dataproc.googleapis.com/v1
          - job_error: null
    - create_cluster:
        call: http.post
        args:
          url: '$${dataproc_url + "/projects/" + project + "/regions/" + region + "/clusters"}'
          auth:
            type: OAuth2
            scope: https://www.googleapis.com/auth/cloud-platform
          body:
            projectId: $${project}
            clusterName: $${cluster}
            config:
              tempBucket: ${staging_bucket}
              gceClusterConfig:
                serviceAccount: ${spark_service_account}
                serviceAccountScopes:
                  - https://www.googleapis.com/auth/cloud-platform
              masterConfig:
                numInstances: 1
                machineTypeUri: e2-standard-2
                diskConfig:
                  bootDiskSizeGb: 50
              softwareConfig:
                imageVersion: 2.2-debian12
                optionalComponents:
                  - ICEBERG
                properties:
                  "dataproc:dataproc.allow.zero.workers": "true"
              lifecycleConfig:
                idleDeleteTtl: 600s
                autoDeleteTtl: 1800s
        result: create_operation
    - get_create_operation:
        call: http.get
        args:
          url: '$${dataproc_url + "/" + create_operation.body.name}'
          auth:
            type: OAuth2
            scope: https://www.googleapis.com/auth/cloud-platform
        result: create_status
    - check_create_operation:
        switch:
          - condition: $${not("done" in create_status.body)}
            next: wait_for_cluster
          - condition: $${"error" in create_status.body}
            next: create_failed
          - condition: $${create_status.body.done == true}
            next: run_load
    - wait_for_cluster:
        call: sys.sleep
        args:
          seconds: 15
        next: get_create_operation
    - create_failed:
        raise: $${create_status.body.error}
    - run_load:
        try:
          steps:
            - submit_job:
                call: http.post
                args:
                  url: '$${dataproc_url + "/projects/" + project + "/regions/" + region + "/jobs:submit"}'
                  auth:
                    type: OAuth2
                    scope: https://www.googleapis.com/auth/cloud-platform
                  body:
                    job:
                      placement:
                        clusterName: $${cluster}
                      pysparkJob:
                        mainPythonFileUri: ${load_script_uri}
                        args:
                          - --source=${raw_csv_uri}
                          - --expected-rows=${expected_rows}
                          - --polaris-url=${polaris_url}
                          - --polaris-secret=${polaris_secret}
                result: load_job
            - wait_for_job:
                call: http.get
                args:
                  url: '$${dataproc_url + "/projects/" + project + "/regions/" + region + "/jobs/" + load_job.body.reference.jobId}'
                  auth:
                    type: OAuth2
                    scope: https://www.googleapis.com/auth/cloud-platform
                result: job_status
            - check_job:
                switch:
                  - condition: $${job_status.body.status.state == "DONE"}
                    next: load_complete
                  - condition: $${job_status.body.status.state == "ERROR" or job_status.body.status.state == "CANCELLED"}
                    next: job_failed
            - wait_before_poll:
                call: sys.sleep
                args:
                  seconds: 15
                next: wait_for_job
            - job_failed:
                raise: $${job_status.body.status.details}
            - load_complete:
                assign:
                  - loaded_job_id: $${job_status.body.reference.jobId}
        except:
          as: error
          steps:
            - capture_error:
                assign:
                  - job_error: $${error}
    - delete_cluster:
        call: http.delete
        args:
          url: '$${dataproc_url + "/projects/" + project + "/regions/" + region + "/clusters/" + cluster}'
          auth:
            type: OAuth2
            scope: https://www.googleapis.com/auth/cloud-platform
        result: delete_operation
    - get_delete_operation:
        call: http.get
        args:
          url: '$${dataproc_url + "/" + delete_operation.body.name}'
          auth:
            type: OAuth2
            scope: https://www.googleapis.com/auth/cloud-platform
        result: delete_status
    - check_delete_operation:
        switch:
          - condition: $${not("done" in delete_status.body)}
            next: wait_for_delete
          - condition: $${"error" in delete_status.body}
            next: delete_failed
          - condition: $${delete_status.body.done == true}
            next: finish
    - wait_for_delete:
        call: sys.sleep
        args:
          seconds: 15
        next: get_delete_operation
    - delete_failed:
        raise: $${delete_status.body.error}
    - finish:
        switch:
          - condition: $${job_error != null}
            next: raise_error
        next: complete
    - raise_error:
        raise: $${job_error}
    - complete:
        return:
          jobId: $${loaded_job_id}
          clusterDeleted: true
