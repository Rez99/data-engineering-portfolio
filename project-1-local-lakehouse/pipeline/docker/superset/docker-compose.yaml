services:
  superset-db:
    image: postgres:17
    environment:
      POSTGRES_DB: superset
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: ${SUPERSET_DATABASE_PASSWORD}
    volumes:
      - superset-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset -d superset"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  superset-init:
    image: lakehouse-superset:6.1.0
    build: .
    env_file:
      - .env
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
    volumes:
      - ../../scripts/superset_config.py:/app/pythonpath/superset_config.py:ro
      - superset-home:/app/superset_home
    depends_on:
      superset-db:
        condition: service_healthy
    command:
      - /bin/bash
      - -c
      - |
        set -e
        superset db upgrade
        if ! superset fab list-users | grep -q "$${SUPERSET_ADMIN_USERNAME}"; then
          superset fab create-admin \
            --username "$${SUPERSET_ADMIN_USERNAME}" \
            --firstname "$${SUPERSET_ADMIN_FIRSTNAME}" \
            --lastname "$${SUPERSET_ADMIN_LASTNAME}" \
            --email "$${SUPERSET_ADMIN_EMAIL}" \
            --password "$${SUPERSET_ADMIN_PASSWORD}"
        fi
        superset init

  superset:
    image: lakehouse-superset:6.1.0
    build: .
    env_file:
      - .env
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
    volumes:
      - ../../scripts/superset_config.py:/app/pythonpath/superset_config.py:ro
      - superset-home:/app/superset_home
    ports:
      - "8088:8088"
    depends_on:
      superset-db:
        condition: service_healthy
      superset-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8088/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  superset-assets:
    image: lakehouse-superset:6.1.0
    build: .
    env_file:
      - .env
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
    volumes:
      - ../../scripts/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ../../scripts/superset_init_duckdb.py:/app/pythonpath/superset_init_duckdb.py:ro
      - ../../scripts/superset_assets:/app/pythonpath/superset_assets:ro
      - superset-home:/app/superset_home
    depends_on:
      superset-db:
        condition: service_healthy
      superset-init:
        condition: service_completed_successfully
    command:
      - /bin/bash
      - -c
      - |
        set -e
        python /app/pythonpath/superset_init_duckdb.py
        superset import-directory /app/pythonpath/superset_assets --overwrite

volumes:
  superset-db-data:
  superset-home:
